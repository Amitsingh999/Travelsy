<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travelsy</title>
    <meta name="description"
        content="Travelsy is a single-page travel agency template designed in Figma. The goal is to create a responsive, visually appealing landing page for a travel company that highlights key destinations, services, and encourages bookings." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Lexend:wght@100..900&family=Mulish:ital,wght@0,200..1000;1,200..1000&family=Space+Grotesk:wght@300..700&display=swap"
        rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="./css/style.min.css">

</head>

<body>

    <header>
        <div class="heading">
            <div class="container d-flex flex-wrap topbar-stack-center">
                <div class="text-white px-2 py-2 d-flex align-items-center flex-grow-1">
                    <address class="d-flex gap-4 align-items-center mb-0">
                        <div class="d-flex align-items-center gap-2">
                            <img src="./images/phone-icon.svg" alt="Call us icon">
                            <a href="tel:+911234567890" class="text-white fw-semibold text-decoration-none">+91 12345 67890</a>
                        </div>
                        <div class="d-flex align-items-center gap-2">
                            <img src="./images/message-icon.svg" alt="Email icon">
                            <a href="mailto:example@gmail.com"
                                class="text-white fw-semibold text-decoration-none">example@gmail.com</a>
                        </div>
                    </address>
                </div>

                <div class="text-white px-4 py-2 d-flex align-items-center gap-3">
                    <div class="d-flex align-items-center gap-2 border-end pe-3">
                        <img src="./images/login.icon.svg" alt="Login-Icon" class="rounded-circle btn btn-light">
                        <a href="#" class="text-white fw-semibold text-decoration-none">Login / Register</a>
                    </div>
                    <nav aria-label="Social media" class="d-flex gap-2">
                        <a href="#" class="btn btn-light btn-sm rounded-circle" aria-label="Facebook">
                            <img src="./images/social-media-logo/facebook-icon.svg" alt="facebook-icon">
                        </a>
                        <a href="#" class="btn btn-light btn-sm rounded-circle" aria-label="Twitter">
                            <img src="./images/social-media-logo/twitter.icon.svg" alt="twitter-icon">
                        </a>
                        <a href="#" class="btn btn-light btn-sm rounded-circle" aria-label="YouTube">
                            <img src="./images/social-media-logo/youtube-icon.svg" alt="youtube-icon">
                        </a>
                        <a href="#" class="btn btn-light btn-sm rounded-circle" aria-label="Instagram">
                            <img src="./images/social-media-logo/instagram-icon.svg" alt="instagram-icon">
                        </a>
                    </nav>
                </div>

            </div>
        </div>

        <div class="container">
            <nav class="navbar navbar-expand-lg pt-5 mb-5">
                <div class="container-fluid">
                    <a class="navbar-brand fw-bold fs-3 heading-font text-primary" href="#">Travel<span class="text-black">sy</span></a>
                    <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                        data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent"
                        aria-expanded="false" aria-label="Toggle navigation">
                        <span class="navbar-toggler-icon"></span>
                    </button>
                    <div class="collapse navbar-collapse" id="navbarSupportedContent">
                        <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
                            <li class="nav-item">
                                <a class="nav-link" aria-current="page" href="#">Home</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" href="#">About Us</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" href="#">Host A Venue</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" href="#">Hotels</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" href="#">Blog</a>
                            </li>
                        </ul>

                        <div class="d-flex flex-column flex-lg-row align-items-start gap-2 mt-3 mt-lg-0">

                            <span class="search-icon px-3 p-2" role="img" aria-label="Search">
                                <i class="bi bi-search text-primary" aria-hidden="true"></i>
                            </span>

                            <a href="#"
                                class="btn btn-primary btn-sm text-white extrabold py-2 px-5 rounded-pill">Contact Us
                                <img src="./images/phone-icon.svg" alt="Call us icon" loading="lazy">
                            </a>
                        </div>
                    </div>
                </div>
            </nav>
        </div>

    </header>

    <main>

    </main>

    <footer>

    </footer>



    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q"
        crossorigin="anonymous"></script>
</body>

</html>
